<nav class="site-nav">
  <div class="container">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="dot"></span>{{ site.author.name }}</a>

    <ul class="nav-links" id="nav-links">
      {% for item in site.nav %}
        {% assign is_active = false %}
        {% if page.url == item.url %}{% assign is_active = true %}{% endif %}
        <li><a href="{{ item.url | relative_url }}" {% if is_active %}class="active"{% endif %}>{{ item.title }}</a></li>
      {% endfor %}
    </ul>

    <div class="nav-right">
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light and dark mode" type="button">
        <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" type="button">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
</nav>
